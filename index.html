<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<script>
/* 版本自清理（防循环版）：注销旧 Service Worker + 清 Cache Storage，然后重载一次。
   关键约束：CloudStudio CDN 对不带参数的 HTML 会较长时间返回旧版，
   旧版页面（TARGET=旧值）与新版页面（TARGET=新值）会互相把对方判为"过期"，
   若按版本号判断就会无限 reload → 闪屏（2026-09-08 事故）。
   因此改为「按会话限流」：sessionStorage 记录自愈时间，8 小时内最多自愈一次，
   无论加载到的是新版还是旧版页面都绝不再触发第二次 reload。 */
(function(){
  var KEY = '__wb_boot_clean__';
  var WINDOW_MS = 8 * 60 * 60 * 1000;

  /* 紧急修复模式：URL 带 _gatefix 时，跳过 8 小时窗口强制清理缓存并重载，
     解决「旧 index.html 缓存引用已删除的 crypto-gate.js → 脚本 404 → 数据全 404」 */
  var forceFix = false;
  try {
    if (new URL(location.href).searchParams.has('_gatefix')) {
      if (!sessionStorage.getItem('__wb_gatefix_done__')) {
        sessionStorage.setItem('__wb_gatefix_done__', '1');
        forceFix = true;
      }
    }
  } catch (e) {}

  if (!forceFix) {
    try {
      var last = parseInt(sessionStorage.getItem(KEY) || '0', 10);
      if (Date.now() - last < WINDOW_MS) return;   /* 窗口内：绝不清理，绝不 reload */
      sessionStorage.setItem(KEY, String(Date.now()));
    } catch (e) { return; }                        /* 存储不可用：直接放弃自愈，保证不闪屏 */
  }

  var cleaned = false;
  function reload() {
    if (cleaned) return;
    cleaned = true;
    var u = new URL(location.href);
    u.hash = '';
    if (!u.searchParams.has('_fresh')) {
      u.searchParams.set('_fresh', Date.now().toString());
    }
    location.replace(u.href);
  }
  var todo = 0;
  if (navigator.serviceWorker) {
    todo++;
    navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){ return r.unregister(); }));
    }).finally(function(){ if(--todo===0) reload(); });
  }
  if (window.caches) {
    todo++;
    caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){ return caches.delete(k); }));
    }).finally(function(){ if(--todo===0) reload(); });
  }
  if (todo === 0) reload();
  setTimeout(reload, 1000); /* 兜底：1秒后无论如何重载 */
})();
</script>
